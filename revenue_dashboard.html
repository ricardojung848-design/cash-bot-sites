<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CashBot Revenue Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #111827; color: #f3f4f6; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 1rem; }
    .card { background: #1f2937; border-radius: 10px; padding: 1rem; }
    .muted { color: #9ca3af; }
  </style>
</head>
<body>
  <h1>Revenue Dashboard</h1>
  <div class="grid">
    <div class="card"><strong>Total Revenue</strong><br>$0.00</div>
    <div class="card"><strong>Total Clicks</strong><br>0</div>
    <div class="card"><strong>Conversion Rate</strong><br>0.00%</div>
  </div>
  <p class="muted" style="margin-top: 1rem;">Wird durch <code>Modul_RevenueTracker.py</code> überschrieben, sobald Daten erzeugt werden.</p>
</body>
</html>
